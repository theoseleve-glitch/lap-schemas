[project]
name = "lap-schemas"
version = "0.0.1"
description = "Shared data contracts for LAP — Pydantic source of truth."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "LAP" }]
dependencies = [
    "pydantic>=2.13",
    "uuid6>=2024",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
